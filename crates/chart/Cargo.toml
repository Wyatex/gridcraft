[package]
name = "gridcraft-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft charts: data resolution, layout into toolkit-free primitives, sparklines and a small rasteriser"

[lints]
workspace = true

[features]
default = ["eval"]
eval = ["gridcraft-calc/eval"]

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-model = { path = "../model", default-features = false }
gridcraft-calc = { path = "../calc", default-features = false }
gridcraft-numfmt = { workspace = true }
serde = { workspace = true }
