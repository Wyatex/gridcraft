[package]
name = "gridcraft-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
default = ["write", "ods", "latex"]
write = []
ods = ["dep:craft-ods"]
latex = ["gridcraft-math/latex", "gridcraft-model/latex", "dep:craft-math"]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-math = { path = "../math", default-features = false }
gridcraft-model = { path = "../model", default-features = false }
craft-cfb = { workspace = true }
craft-csv = { workspace = true }
craft-drawingml = { workspace = true }
craft-math = { workspace = true, optional = true }
craft-ods = { workspace = true, optional = true }
craft-offcrypto = { workspace = true }
craft-opc = { workspace = true }
craft-xls = { workspace = true }
craft-xml = { workspace = true }
craft-xlsx = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Every registered function name, for the formula file-spelling test.
gridcraft-functions = { workspace = true }
