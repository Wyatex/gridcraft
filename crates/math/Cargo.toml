[package]
name = "gridcraft-math"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft equations: LaTeX laid out as plain glyph, rule and path data, and OMML for xlsx"

[lints]
workspace = true

[features]
default = ["latex"]
latex = ["dep:ratex-parser", "dep:ratex-layout", "dep:ratex-types", "dep:ratex-font"]

[dependencies]
ratex-parser = { workspace = true, optional = true }
ratex-layout = { workspace = true, optional = true }
ratex-types = { workspace = true, optional = true }
ratex-font = { workspace = true, optional = true }
