[package]
name = "gridcraft-calc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft calculation engine: dependency graph, recalculation, evaluator, dynamic arrays"

[lints]
workspace = true

[features]
default = ["eval"]
eval = ["dep:gridcraft-functions"]

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true, optional = true }
gridcraft-numfmt = { workspace = true }
gridcraft-model = { path = "../model", default-features = false }
log = { workspace = true }
