[package]
name = "gridcraft-preview"
description = "GridCraft Preview - Read-only XLSX/XLS viewer for the web (NPM package)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-preview"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = "1.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Location",
    "CssStyleDeclaration",
    "Navigator",
    "MessageEvent",
    "UrlSearchParams",
    "Storage",
    "File",
    "FileReader",
    "ProgressEvent",
    "CustomEvent",
    "CustomEventInit",
    "Event",
    "EventTarget",
] }
