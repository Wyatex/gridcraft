[package]
name = "gridcraft-preview"
description = "GridCraft Preview - Read-only XLSX/XLS viewer for the web (NPM package)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-preview"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { path = "../../crates/engine", default-features = false }
gridcraft-ui-egui = { path = "../../crates/ui-egui", default-features = false }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardItem",
    "CustomEvent",
    "Event",
    "EventTarget",
    "File",
    "Navigator",
] }
